version: 1
project: kitchenowl-household-intelligence
entry_issue: 112
status: ready
principles:
  - one_issue_entrypoint
  - plan_as_code
  - audit_every_mutation
  - operator_overrides_win
  - fail_closed_on_uncertain_stock_changes
  - separate_need_from_purchasing_power
workstreams:
